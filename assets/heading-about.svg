<svg xmlns="http://www.w3.org/2000/svg" width="900" height="56" viewBox="0 0 900 56" role="img" aria-label="About me">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs>
<style>
.n{font:600 13px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#f59e0b;letter-spacing:2px}
.t{font:800 24px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e6edf7}
.s{font:500 13px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#9fb0c8}
.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.dot{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
</style>
<rect x=".5" y=".5" width="899" height="55" rx="12" fill="#0b1018" stroke="#1f2a3d"/>
<circle class="dot" cx="26" cy="28" r="4" fill="#f59e0b"/>
<text class="n" x="42" y="33">// 01</text>
<text class="t" x="104" y="36">About me</text>
<text class="s" x="874" y="33" text-anchor="end">observe</text>
<rect class="bar" x="14" y="51" width="872" height="3" rx="1.5" fill="url(#g)"/>
</svg>
