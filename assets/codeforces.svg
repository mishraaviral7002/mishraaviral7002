<text class="hd" x="38" y="27">CODEFORCES · LIVE</text>
<g class="fu" style="animation-delay:.1s"><text class="big" x="22" y="92">1241</text><text class="rk" x="26" y="116">PUPIL</text></g>
<g class="fu" style="animation-delay:.25s">
  <text class="lb" x="236" y="48">MAX RATING</text><text class="vl" x="236" y="70">1241</text>
  <text class="lb" x="330" y="48">MAX RANK</text><text class="vl" x="330" y="70" style="font-size:14px">Pupil</text>
  <text class="lb" x="236" y="94">CONTESTS</text><text class="vl" x="236" y="116">12</text>
  <text class="lb" x="330" y="94">SOLVED</text><text class="vl" x="330" y="116">150</text>
</g>
