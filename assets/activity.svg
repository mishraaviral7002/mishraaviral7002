
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Contribution activity graph">
<defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb923c" stop-opacity=".4"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></linearGradient>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#fb923c"/></linearGradient></defs>
<style>
.hd{font:600 11px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;letter-spacing:2px;fill:#b8a9a3}
.lb{font:600 10px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;letter-spacing:1.5px;fill:#b8a9a3}
.vl{font:800 30px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#f3ece8}
.st{font:500 9px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#7a6561}
.pl{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
.fu{opacity:0;animation:fu .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.tot{font:800 16px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#f3ece8}
.mo{font:500 10px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#7a6561}
.line{fill:none;stroke:url(#ln);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.area{opacity:0;animation:fade 1s 2s forwards}
@keyframes fade{to{opacity:1}}
.ring{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
</style>
