="#f59e0b" stroke-opacity=".8"/><text class="rm" x="384" y="36" fill="#f59e0b">ROOM 03</text><text class="rn" x="384" y="64">The Library</text><text class="sb" x="384" y="82">Algorithms</text><line x1="384" y1="94" x2="515" y2="94" stroke="#1f2a3d"/><text class="it" x="384" y="118"><tspan fill="#f59e0b">›</tspan> Data structures</text><text class="it" x="384" y="140"><tspan fill="#f59e0b">›</tspan> Codeforces</text><text class="it" x="384" y="162"><tspan fill="#f59e0b">›</tspan> LeetCode</text></g><g class="fu" style="animation-delay:0.36s"><rect x="552.5" y="10.5" width="163" height="169" rx="14" fill="#0e1524" stroke="#1f2a3d"/><rect class="lit" x="552.5" y="10.5" width="163" height="169" rx="14" fill="#f472b6" stroke="#f472b6" style="animation-delay:4.199999999999999s"/><path d="M678 44 v-14 a11 11 0 0 1 22 0 v14 z" fill="none" stroke="#f472b6" stroke-opacity=".8"/><text class="rm" x="568" y="36" fill="#f472b6">ROOM 04</text><text class="rn" x="568" y="64">The Gatehouse</text><text class="sb" x="568" y="82">Security</text><line x1="568" y1="94" x2="699" y2="94" stroke="#1f2a3d"/><text class="it" x="568" y="118"><tspan fill="#f472b6">›</tspan> Authentication</text><text class="it" x="568" y="140"><tspan fill="#f472b6">›</tspan> Cookie sessions</text><text class="it" x="568" y="162"><tspan fill="#f472b6">›</tspan> Protected rooms</text></g><g class="fu" style="animation-delay:0.48s"><rect x="736.5" y="10.5" width="163" height="169" rx="14" fill="#0e1524" stroke="#1f2a3d"/><rect class="lit" x="736.5" y="10.5" width="163" height="169" rx="14" fill="#60a5fa" stroke="#60a5fa" style="animation-delay:5.6s"/><path d="M862 44 v-14 a11 11 0 0 1 22 0 v14 z" fill="none" stroke="#60a5fa" stroke-opacity=".8"/><text class="rm" x="752" y="36" fill="#60a5fa">ROOM 05</text><text class="rn" x="752" y="64">The Dock</text><text class="sb" x="752" y="82">Shipping</text><line x1="752" y1="94" x2="883" y2="94" stroke="#1f2a3d"/><text class="it" x="752" y="118"><tspan fill="#60a5fa">›</ts