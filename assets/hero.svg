<style>
.tw{opacity:.15;animation:tw 3.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.9}}
.fu{opacity:0;animation:fu .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lab{font:600 12px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;letter-spacing:3px;fill:#f59e0b}
.nm{font:800 60px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;letter-spacing:-1.5px;fill:url(#nm)}
.sub{font:500 19px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#9fb0c8}
.chip{font:600 12.5px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e6edf7}
.mono{font:500 13px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#9fb0c8}
.ln{font:500 15px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#e6edf7}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.steam{fill:none;stroke:#cfe3ff;stroke-width:2;stroke-linecap:round;stroke-dasharray:30;opacity:0;animation:steam 3.2s ease-in-out infinite}
@keyframes steam{0%{stroke-dashoffset:30;opacity:0}40%{opacity:.7}100%{stroke-dashoffset:-30;opacity:0}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.glow{animation:glow 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glow{50%{transform:scale(1.25);opacity:.6}}
</style>

