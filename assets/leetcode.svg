<g class="fu" style="animation-delay:0.2s"><text class="dl" x="236" y="52" fill="#22c55e">Easy</text><text class="ct" x="406" y="52" text-anchor="end">43 / 975</text><rect x="236" y="60" width="170" height="6" rx="3" fill="#161f33"/><rect x="236" y="60" width="0" height="6" rx="3" fill="#22c55e"><animate attributeName="width" from="0" to="7.5" dur="1.3s" begin="0.50s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/></rect></g><g class="fu" style="animation-delay:0.3s"><text class="dl" x="236" y="82" fill="#f59e0b">Medium</text><text class="ct" x="406" y="82" text-anchor="end">53 / 2,146</text><rect x="236" y="90" width="170" height="6" rx="3" fill="#161f33"/><rect x="236" y="90" width="0" height="6" rx="3" fill="#f59e0b"><animate attributeName="width" from="0" to="4.2" dur="1.3s" begin="0.65s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/></rect></g><g class="fu" style="animation-delay:0.4s"><text class="dl" x="236" y="112" fill="#ef4444">Hard</text><text class="ct" x="406" y="112" text-anchor="end">12 / 989</text><rect x="236" y="120" width="170" height="6" rx="3" fill="#161f33"/><rect x="236" y="120" width="0" height="6" rx="3" fill="#ef4444"><animate attributeName="width" from="0" to="2.1" dur="1.3s" begin="0.80s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/></rect></g>
