
<svg xmlns="http://www.w3.org/2000/svg" width="430" height="200" viewBox="0 0 430 200" role="img" aria-label="Top languages card" xmlns:c2pa="http://c2pa.org/manifest">
<defs><clipPath id="rev"><rect x="24" y="44" width="0" height="20" rx="6"><animate attributeName="width" from="0" to="382" dur="1.4s" begin=".2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/></rect></clipPath></defs>
<style>
.hd{font:600 11px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;letter-spacing:2px;fill:#9fb0c8}
.lb{font:600 10px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;letter-spacing:1.5px;fill:#9fb0c8}
.vl{font:800 30px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e6edf7}
.st{font:500 9px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#5b6b88}
.pl{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
.fu{opacity:0;animation:fu .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.nm{font:600 13px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e6edf7}
.pc{font:500 12px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#9fb0c8}
</style>
<rect x=".5" y=".5" width="429" height="199" rx="14" fill="#0e1524" stroke="#1f2a3d"/>
<circle class="pl" cx="26" cy="23" r="4" fill="#8b7cff"/><text class="hd" x="38" y="27">TOP LANGUAGES · LIVE</text>
<rect x="24" y="48" width="382" height="12" rx="6" fill="#161f33"/>
<g clip-path="url(#rev)"></g>
<text class="st" x="24" y="100">awaiting first sync</text>
<text class="st" x="406" y="192" text-anchor="end">awaiting first sync</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>