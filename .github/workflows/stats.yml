name: Update live stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render stat cards
        env:
          CF_HANDLE: ${{ secrets.CF_HANDLE }}
          LC_USER: aviralmishra9876
        run: python scripts/update_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/codeforces.svg assets/leetcode.svg
          git diff --cached --quiet || (git commit -m "chore: refresh live stats" && git push)
